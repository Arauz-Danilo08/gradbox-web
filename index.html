<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GradBox - Recuerdos que duran para siempre</title>
    <meta name="description" content="Tienda en línea de productos personalizados para graduaciones.">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel para compilar JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #FDFBF7; }
        h1, h2, h3, h4, .font-playfair { font-family: 'Playfair Display', serif; }
        
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInRight {
          from { transform: translateX(100%); }
          to { transform: translateX(0); }
        }
        @keyframes blob {
          0% { transform: translate(0px, 0px) scale(1); }
          33% { transform: translate(30px, -50px) scale(1.1); }
          66% { transform: translate(-20px, 20px) scale(0.9); }
          100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out forwards; }
        .animate-slideInRight { animation: slideInRight 0.3s ease-out forwards; }
        .animate-blob { animation: blob 7s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- AQUI SE CAMBIARAN LAS FOTOS LUEGO ---
        // Solo tendrás que cambiar el link donde dice 'image: ...'
        const PRODUCTS = [
          {
            id: 1,
            name: 'Camiseta de Graduación "Clase 2026"',
            description: 'Camiseta 100% algodón. Personaliza el frente con tu nombre o frase favorita.',
            price: 350,
            image: 'https://placehold.co/400x400/E8D6CB/5A3D31?text=Camiseta+Graduacion',
            customizable: true,
            colors: ['Blanco', 'Negro', 'Beige']
          },
          {
            id: 2,
            name: 'Vaso Térmico Personalizado',
            description: 'Vaso de acero inoxidable que mantiene tus bebidas frías o calientes. Añade tu nombre o logo de generación.',
            price: 450,
            image: 'https://placehold.co/400x400/E8D6CB/5A3D31?text=Vaso+Termico',
            customizable: true,
            colors: ['Rosa Suave', 'Nude', 'Blanco', 'Negro']
          },
          {
            id: 3,
            name: 'Marco de Fotos "Recuerdos"',
            description: 'Marco de madera elegante con detalles grabados. Ideal para la foto oficial de graduación.',
            price: 250,
            image: 'https://placehold.co/400x400/E8D6CB/5A3D31?text=Marco+Fotografico',
            customizable: true,
            colors: ['Madera Clara', 'Madera Oscura', 'Blanco']
          },
          {
            id: 4,
            name: 'Caja de Regalo "GradBox Premium"',
            description: 'El paquete completo. Incluye camiseta, vaso, chocolates y una tarjeta personalizada.',
            price: 1200,
            image: 'https://placehold.co/400x400/E8D6CB/5A3D31?text=GradBox+Premium',
            customizable: true,
            colors: ['Caja Rosa', 'Caja Kraft']
          }
        ];

        const ShoppingCartIcon = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
        );
        const MenuIcon = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        );
        const CloseIcon = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        );
        const StarIcon = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        );

        function App() {
          const [activeTab, setActiveTab] = useState('inicio');
          const [cart, setCart] = useState([]);
          const [isCartOpen, setIsCartOpen] = useState(false);
          const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
          
          const [customizingProduct, setCustomizingProduct] = useState(null);
          const [customOptions, setCustomOptions] = useState({ name: '', color: '', phrase: '' });

          const addToCart = (product, customizations = null) => {
            setCart([...cart, { ...product, cartId: Date.now(), customizations }]);
            setCustomizingProduct(null);
            setCustomOptions({ name: '', color: '', phrase: '' });
            setIsCartOpen(true);
          };

          const removeFromCart = (cartId) => {
            setCart(cart.filter(item => item.cartId !== cartId));
          };

          const getCartTotal = () => cart.reduce((total, item) => total + item.price, 0);

          const openCustomization = (product) => {
            setCustomizingProduct(product);
            setCustomOptions({ name: '', color: product.colors[0], phrase: '' });
          };

          const navigateTo = (tab) => {
            setActiveTab(tab);
            setIsMobileMenuOpen(false);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          const handleCheckout = () => {
             let message = "¡Hola GradBox! Quisiera realizar el siguiente pedido:\n\n";
             cart.forEach((item, index) => {
                 message += `${index + 1}. ${item.name} (C$ ${item.price})\n`;
                 if(item.customizations) {
                     if(item.customizations.name) message += `   - Nombre: ${item.customizations.name}\n`;
                     if(item.customizations.color) message += `   - Color: ${item.customizations.color}\n`;
                     if(item.customizations.phrase) message += `   - Frase: ${item.customizations.phrase}\n`;
                 }
                 message += `\n`;
             });
             message += `Total estimado: C$ ${getCartTotal()}\n\n¿Me indican los pasos para realizar el pago?`;
             
             // En un entorno real, cambia el numero '12345678' por el de la empresa.
             const whatsappUrl = `https://wa.me/50512345678?text=${encodeURIComponent(message)}`;
             window.open(whatsappUrl, '_blank');
          };

          const Header = () => (
            <header className="sticky top-0 z-40 bg-[#FDFBF7]/90 backdrop-blur-md border-b border-[#E8D6CB] shadow-sm">
              <div className="container mx-auto px-4 sm:px-6 lg:px-8">
                <div className="flex items-center justify-between h-20">
                  <div className="flex-shrink-0 cursor-pointer" onClick={() => navigateTo('inicio')}>
                    <div className="flex flex-col items-center">
                      <h1 className="font-playfair text-4xl text-[#8B5E3C] leading-none">GradBox</h1>
                      <p className="text-[10px] tracking-[0.2em] text-[#C88675] uppercase mt-1">Recuerdos que duran para siempre</p>
                    </div>
                  </div>
                  
                  <nav className="hidden md:flex space-x-8">
                    {['inicio', 'catálogo', 'el proyecto', 'contacto'].map((tab) => (
                      <button
                        key={tab}
                        onClick={() => navigateTo(tab)}
                        className={`text-sm font-medium uppercase tracking-wider transition-colors duration-200 ${
                          activeTab === tab ? 'text-[#C88675] border-b-2 border-[#C88675]' : 'text-[#8B5E3C] hover:text-[#C88675]'
                        }`}
                      >
                        {tab}
                      </button>
                    ))}
                  </nav>

                  <div className="flex items-center space-x-4">
                    <button onClick={() => setIsCartOpen(true)} className="relative p-2 text-[#8B5E3C] hover:text-[#C88675] transition-colors">
                      <ShoppingCartIcon />
                      {cart.length > 0 && (
                        <span className="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/4 -translate-y-1/4 bg-[#C88675] rounded-full">
                          {cart.length}
                        </span>
                      )}
                    </button>
                    <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="md:hidden p-2 text-[#8B5E3C]">
                      {isMobileMenuOpen ? <CloseIcon /> : <MenuIcon />}
                    </button>
                  </div>
                </div>
              </div>

              {isMobileMenuOpen && (
                <div className="md:hidden bg-[#FDFBF7] border-t border-[#E8D6CB]">
                  <div className="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                    {['inicio', 'catálogo', 'el proyecto', 'contacto'].map((tab) => (
                      <button
                        key={tab}
                        onClick={() => navigateTo(tab)}
                        className={`block w-full text-left px-3 py-2 rounded-md text-base font-medium uppercase tracking-wider ${
                          activeTab === tab ? 'bg-[#F5EBE6] text-[#C88675]' : 'text-[#8B5E3C] hover:bg-[#F5EBE6] hover:text-[#C88675]'
                        }`}
                      >
                        {tab}
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </header>
          );

          const HomeView = () => (
            <div className="animate-fadeIn">
              <section className="relative bg-[#F5EBE6] py-20 lg:py-32 overflow-hidden">
                <div className="absolute top-0 left-0 w-64 h-64 bg-[#FDFBF7] rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob"></div>
                <div className="absolute top-0 right-0 w-64 h-64 bg-[#E8D6CB] rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob animation-delay-2000"></div>
                
                <div className="container mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center">
                  <h2 className="text-5xl md:text-7xl font-playfair text-[#5A3D31] mb-6">
                    Celebra tu logro, <br/>
                    <span className="text-[#C88675] italic">conserva el recuerdo.</span>
                  </h2>
                  <p className="mt-4 text-lg md:text-xl text-[#8B5E3C] max-w-2xl mx-auto mb-10">
                    En GradBox hacemos más fácil y menos estresante todo lo relacionado con tu graduación. Encuentra y personaliza todo en un solo lugar.
                  </p>
                  <button 
                    onClick={() => navigateTo('catálogo')}
                    className="inline-flex items-center justify-center px-8 py-4 border border-transparent text-base font-medium rounded-full text-white bg-[#C88675] hover:bg-[#B3705E] transition-colors shadow-lg hover:shadow-xl"
                  >
                    Explorar Catálogo
                  </button>
                </div>
              </section>

              <section className="py-16 bg-[#FDFBF7]">
                <div className="container mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-10 text-center">
                    <div className="p-6 rounded-2xl bg-white shadow-sm border border-[#E8D6CB]">
                      <div className="w-12 h-12 mx-auto bg-[#F5EBE6] text-[#C88675] rounded-full flex items-center justify-center mb-4">
                        <StarIcon />
                      </div>
                      <h3 className="text-xl font-playfair text-[#5A3D31] mb-2">Todo en un lugar</h3>
                      <p className="text-sm text-[#8B5E3C]">Ahorra tiempo. Camisetas, vasos, recuerdos y regalos, todo disponible sin buscar en múltiples tiendas.</p>
                    </div>
                    <div className="p-6 rounded-2xl bg-white shadow-sm border border-[#E8D6CB]">
                      <div className="w-12 h-12 mx-auto bg-[#F5EBE6] text-[#C88675] rounded-full flex items-center justify-center mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                      </div>
                      <h3 className="text-xl font-playfair text-[#5A3D31] mb-2">100% Personalizable</h3>
                      <p className="text-sm text-[#8B5E3C]">Elige colores, nombres, fotografías, frases o diseños. Haz que tu producto sea verdaderamente único.</p>
                    </div>
                    <div className="p-6 rounded-2xl bg-white shadow-sm border border-[#E8D6CB]">
                      <div className="w-12 h-12 mx-auto bg-[#F5EBE6] text-[#C88675] rounded-full flex items-center justify-center mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                      </div>
                      <h3 className="text-xl font-playfair text-[#5A3D31] mb-2">Para Graduados y Familia</h3>
                      <p className="text-sm text-[#8B5E3C]">Perfecto para prepararte para el gran día o para regalar ese detalle especial a un ser querido.</p>
                    </div>
                  </div>
                </div>
              </section>
            </div>
          );

          const CatalogView = () => (
            <div className="py-12 bg-[#FDFBF7] min-h-screen animate-fadeIn">
              <div className="container mx-auto px-4 sm:px-6 lg:px-8">
                <div className="text-center mb-12">
                  <h2 className="text-4xl font-playfair text-[#5A3D31] mb-4">Nuestro Catálogo</h2>
                  <p className="text-[#8B5E3C] max-w-2xl mx-auto">Selecciona tus productos favoritos y personalízalos a tu gusto. Creados especialmente para celebrar tu esfuerzo.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                  {PRODUCTS.map((product) => (
                    <div key={product.id} className="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-shadow border border-[#E8D6CB] flex flex-col">
                      <div className="aspect-w-1 aspect-h-1 w-full bg-[#F5EBE6]">
                        <img src={product.image} alt={product.name} className="w-full h-64 object-cover object-center" />
                      </div>
                      <div className="p-6 flex flex-col flex-grow">
                        <h3 className="text-xl font-playfair text-[#5A3D31] mb-2">{product.name}</h3>
                        <p className="text-sm text-[#8B5E3C] mb-4 flex-grow">{product.description}</p>
                        <div className="flex items-center justify-between mt-auto pt-4 border-t border-[#F5EBE6]">
                          <span className="text-lg font-bold text-[#C88675]">C$ {product.price}</span>
                          <button 
                            onClick={() => openCustomization(product)}
                            className="px-4 py-2 bg-[#F5EBE6] text-[#8B5E3C] text-sm font-medium rounded-full hover:bg-[#C88675] hover:text-white transition-colors"
                          >
                            Personalizar
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          );

          const ProjectView = () => (
            <div className="py-16 bg-[#FDFBF7] min-h-screen animate-fadeIn">
              <div className="container mx-auto px-4 sm:px-6 lg:px-8 max-w-4xl">
                <h2 className="text-4xl font-playfair text-[#5A3D31] mb-8 text-center">Acerca del Proyecto</h2>
                
                <div className="space-y-12">
                  <section className="bg-white p-8 rounded-3xl shadow-sm border border-[#E8D6CB]">
                    <h3 className="text-2xl font-playfair text-[#C88675] mb-4 border-b border-[#F5EBE6] pb-2">Resumen Ejecutivo</h3>
                    <p className="text-[#5A3D31] leading-relaxed mb-4">
                      GradBox es un proyecto de comercio electrónico que nace con la idea de hacer más fácil y menos estresante todo lo relacionado con la graduación. Muchas veces, cuando una persona se está preparando para graduarse, tiene que buscar diferentes cosas en distintos lugares: camisetas, vasos, fotografías, regalos, decoraciones, recuerdos y otros productos.
                    </p>
                    <p className="text-[#5A3D31] leading-relaxed">
                      Por esta razón, creamos GradBox, una tienda en línea donde los graduados podrán encontrar diferentes productos relacionados con esta etapa tan especial en un solo lugar.
                    </p>
                  </section>

                  <section className="bg-[#F5EBE6] p-8 rounded-3xl shadow-inner border border-[#E8D6CB]">
                    <h3 className="text-2xl font-playfair text-[#8B5E3C] mb-4 border-b border-[#E8D6CB] pb-2">Oportunidad</h3>
                    <p className="text-[#5A3D31] leading-relaxed font-semibold italic">
                      GradBox busca reunir diferentes productos para graduados en un solo lugar y permitir que cada cliente pueda personalizarlos. De esta manera, una persona podría ahorrar tiempo y realizar sus compras de una forma mucho más organizada.
                    </p>
                  </section>
                </div>
              </div>
            </div>
          );

          const ContactView = () => (
            <div className="py-16 bg-[#FDFBF7] min-h-screen animate-fadeIn">
              <div className="container mx-auto px-4 sm:px-6 lg:px-8 max-w-2xl">
                <div className="text-center mb-12">
                  <h2 className="text-4xl font-playfair text-[#5A3D31] mb-4">Contáctanos</h2>
                  <p className="text-[#8B5E3C]">¿Tienes dudas sobre pedidos especiales o grandes volúmenes para toda tu clase? Escríbenos.</p>
                </div>
                
                <form className="bg-white p-8 rounded-3xl shadow-sm border border-[#E8D6CB] space-y-6" onSubmit={(e) => { e.preventDefault(); alert('¡Gracias por tu mensaje! Te contactaremos pronto.'); }}>
                  <div>
                    <label className="block text-sm font-medium text-[#8B5E3C] mb-1">Nombre Completo</label>
                    <input type="text" className="w-full px-4 py-3 rounded-xl border border-[#E8D6CB] bg-[#FDFBF7] focus:ring-2 focus:ring-[#C88675] focus:border-transparent outline-none" placeholder="Ej. Ana García" required />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-[#8B5E3C] mb-1">Mensaje</label>
                    <textarea rows="4" className="w-full px-4 py-3 rounded-xl border border-[#E8D6CB] bg-[#FDFBF7] focus:ring-2 focus:ring-[#C88675] focus:border-transparent outline-none" placeholder="¿Cómo podemos ayudarte?" required></textarea>
                  </div>
                  <button type="submit" className="w-full py-4 bg-[#C88675] text-white rounded-xl font-medium hover:bg-[#B3705E] transition-colors shadow-md">
                    Enviar Mensaje
                  </button>
                </form>
              </div>
            </div>
          );

          return (
            <div className="min-h-screen flex flex-col">
              <Header />
              
              <main className="flex-grow">
                {activeTab === 'inicio' && <HomeView />}
                {activeTab === 'catálogo' && <CatalogView />}
                {activeTab === 'el proyecto' && <ProjectView />}
                {activeTab === 'contacto' && <ContactView />}
              </main>

              <footer className="bg-[#5A3D31] text-[#FDFBF7] py-12">
                <div className="container mx-auto px-4 text-center">
                  <h2 className="font-playfair text-3xl mb-2 text-[#E8D6CB]">GradBox</h2>
                  <p className="text-sm tracking-widest text-[#C88675] uppercase mb-8">Recuerdos que duran para siempre</p>
                  <p className="text-xs text-[#E8D6CB]/60">© 2026 GradBox. Proyecto Académico - Feria de Innovación.</p>
                </div>
              </footer>

              {customizingProduct && (
                <div className="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
                  <div className="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                    <div className="fixed inset-0 bg-[#5A3D31] bg-opacity-50 backdrop-blur-sm transition-opacity" onClick={() => setCustomizingProduct(null)}></div>
                    <span className="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
                    <div className="inline-block align-bottom bg-[#FDFBF7] rounded-3xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-2xl sm:w-full border border-[#E8D6CB]">
                      <div className="px-4 pt-5 pb-4 sm:p-8">
                        <div className="flex justify-between items-start mb-6">
                          <h3 className="text-2xl font-playfair text-[#5A3D31] font-semibold" id="modal-title">
                            Personaliza tu producto
                          </h3>
                          <button onClick={() => setCustomizingProduct(null)} className="text-[#8B5E3C] hover:text-[#C88675] bg-[#F5EBE6] p-2 rounded-full">
                            <CloseIcon />
                          </button>
                        </div>
                        
                        <div className="grid md:grid-cols-2 gap-8">
                          <div>
                            <img src={customizingProduct.image} alt={customizingProduct.name} className="w-full rounded-2xl border border-[#E8D6CB] shadow-sm" />
                            <p className="mt-4 text-[#8B5E3C] text-sm font-medium">{customizingProduct.name} - C$ {customizingProduct.price}</p>
                          </div>
                          
                          <div className="space-y-5">
                            <div>
                              <label className="block text-sm font-medium text-[#8B5E3C] mb-1">Nombre a grabar/estampar</label>
                              <input 
                                type="text" 
                                value={customOptions.name}
                                onChange={(e) => setCustomOptions({...customOptions, name: e.target.value})}
                                className="w-full px-4 py-2 rounded-xl border border-[#E8D6CB] bg-white focus:ring-2 focus:ring-[#C88675] focus:border-transparent outline-none" 
                                placeholder="Ej. Ana G." 
                              />
                            </div>
                            <div>
                              <label className="block text-sm font-medium text-[#8B5E3C] mb-1">Frase especial (Opcional)</label>
                              <input 
                                type="text" 
                                value={customOptions.phrase}
                                onChange={(e) => setCustomOptions({...customOptions, phrase: e.target.value})}
                                className="w-full px-4 py-2 rounded-xl border border-[#E8D6CB] bg-white focus:ring-2 focus:ring-[#C88675] focus:border-transparent outline-none" 
                                placeholder="Ej. Lo logramos 2026" 
                              />
                            </div>
                            <div>
                              <label className="block text-sm font-medium text-[#8B5E3C] mb-2">Color del producto</label>
                              <div className="flex flex-wrap gap-2">
                                {customizingProduct.colors.map(color => (
                                  <button
                                    key={color}
                                    onClick={() => setCustomOptions({...customOptions, color})}
                                    className={`px-3 py-1 text-sm rounded-full border transition-colors ${
                                      customOptions.color === color 
                                        ? 'bg-[#C88675] border-[#C88675] text-white' 
                                        : 'bg-white border-[#E8D6CB] text-[#8B5E3C] hover:border-[#C88675]'
                                    }`}
                                  >
                                    {color}
                                  </button>
                                ))}
                              </div>
                            </div>
                            
                            <div className="pt-4 border-t border-[#E8D6CB]">
                              <button 
                                onClick={() => addToCart(customizingProduct, customOptions)}
                                className="w-full py-3 bg-[#8B5E3C] text-white rounded-xl font-medium hover:bg-[#5A3D31] transition-colors shadow-md"
                              >
                                Añadir al Carrito
                              </button>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {isCartOpen && (
                <div className="fixed inset-0 z-50 overflow-hidden">
                  <div className="absolute inset-0 bg-[#5A3D31] bg-opacity-50 backdrop-blur-sm transition-opacity" onClick={() => setIsCartOpen(false)}></div>
                  <div className="fixed inset-y-0 right-0 max-w-full flex">
                    <div className="w-screen max-w-md h-full bg-[#FDFBF7] shadow-xl flex flex-col animate-slideInRight">
                      <div className="px-6 py-6 border-b border-[#E8D6CB] flex items-center justify-between bg-white">
                        <h2 className="text-2xl font-playfair text-[#5A3D31]">Tu Pedido</h2>
                        <button onClick={() => setIsCartOpen(false)} className="text-[#8B5E3C] hover:text-[#C88675] p-2 bg-[#F5EBE6] rounded-full">
                          <CloseIcon />
                        </button>
                      </div>
                      
                      <div className="flex-1 overflow-y-auto p-6 space-y-6">
                        {cart.length === 0 ? (
                          <div className="text-center text-[#8B5E3C] mt-10">
                            <ShoppingCartIcon />
                            <p className="mt-4 font-medium">Tu carrito está vacío</p>
                            <button onClick={() => {setIsCartOpen(false); navigateTo('catálogo');}} className="mt-4 text-[#C88675] underline">Ir al catálogo</button>
                          </div>
                        ) : (
                          cart.map((item) => (
                            <div key={item.cartId} className="flex gap-4 bg-white p-4 rounded-2xl border border-[#E8D6CB]">
                              <img src={item.image} alt={item.name} className="w-20 h-20 rounded-xl object-cover" />
                              <div className="flex-1">
                                <h4 className="text-sm font-bold text-[#5A3D31]">{item.name}</h4>
                                <p className="text-[#C88675] font-semibold text-sm">C$ {item.price}</p>
                                {item.customizations && (
                                  <div className="text-xs text-[#8B5E3C] mt-2 space-y-1">
                                    {item.customizations.name && <p><span className="font-semibold">Nombre:</span> {item.customizations.name}</p>}
                                    {item.customizations.color && <p><span className="font-semibold">Color:</span> {item.customizations.color}</p>}
                                    {item.customizations.phrase && <p><span className="font-semibold">Frase:</span> {item.customizations.phrase}</p>}
                                  </div>
                                )}
                              </div>
                              <button onClick={() => removeFromCart(item.cartId)} className="text-[#C88675] hover:text-red-600 text-xs self-start p-2 bg-[#F5EBE6] rounded-full">
                                <CloseIcon />
                              </button>
                            </div>
                          ))
                        )}
                      </div>
                      
                      {cart.length > 0 && (
                        <div className="border-t border-[#E8D6CB] p-6 bg-white">
                          <div className="flex justify-between text-lg font-bold text-[#5A3D31] mb-6">
                            <p>Total Estimado</p>
                            <p>C$ {getCartTotal()}</p>
                          </div>
                          <button 
                            onClick={handleCheckout}
                            className="w-full py-4 bg-[#C88675] text-white rounded-xl font-medium text-lg hover:bg-[#B3705E] transition-colors shadow-lg flex justify-center items-center gap-2"
                          >
                            Pedir por WhatsApp
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
