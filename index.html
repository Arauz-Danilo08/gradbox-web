<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GradBox - Recuerdos que duran para siempre</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'grad-nude': '#F5EBE6',
                        'grad-pink': '#E2C2B3',
                        'grad-brown': '#7A4B3A',
                        'grad-beige': '#F0E5D8'
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-grad-nude text-gray-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [customText, setCustomText] = useState("");

            // Catálogo de productos con las imágenes reales y nombres exactos
            const products = [
                {
                    id: 1,
                    name: "Camiseta Generación",
                    price: 350,
                    img: "./camiseta.png",
                    description: "Camiseta de algodón. Personalízala con tu nombre, frase o logo de generación."
                },
                {
                    id: 2,
                    name: "Vaso Térmico",
                    price: 250,
                    img: "./vaso.png",
                    description: "Vaso para tus bebidas. Agrega tu nombre o diseño favorito."
                },
                {
                    id: 3,
                    name: "Caja GradBox Premium",
                    price: 850,
                    img: "./caja.png",
                    description: "La caja de recuerdos perfecta. Incluye detalles sorpresa y empaque personalizado."
                }
            ];

            const openCustomization = (product) => {
                setSelectedProduct(product);
                setCustomText("");
            };

            const addToCart = () => {
                if (selectedProduct) {
                    setCart([...cart, { ...selectedProduct, customText, quantity: 1, cartId: Date.now() }]);
                    setSelectedProduct(null);
                    setIsCartOpen(true);
                }
            };

            const removeFromCart = (cartId) => {
                setCart(cart.filter(item => item.cartId !== cartId));
            };

            const cartTotal = cart.reduce((total, item) => total + item.price, 0);

            // Función para enviar pedido por WhatsApp con el número +505 8885 7083
            const handleCheckout = () => {
                if (cart.length === 0) return;
                
                const phoneNumber = "50588857083";
                let message = "🎓 *¡Hola GradBox! Quiero realizar el siguiente pedido:*\n\n";
                
                cart.forEach((item, index) => {
                    message += `*${index + 1}. ${item.name}* - C$${item.price}\n`;
                    if (item.customText) {
                        message += `   ✏️ _Personalización: ${item.customText}_\n`;
                    }
                });
                
                message += `\n💰 *Total estimado: C$${cartTotal}*\n\nQuedo a la espera de la confirmación y detalles de pago. ¡Gracias!`;
                
                const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
                window.open(whatsappUrl, '_blank');
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="bg-white shadow-sm sticky top-0 z-40">
                        <div className="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <h1 className="text-3xl font-serif text-grad-brown">GradBox</h1>
                            </div>
                            <button 
                                onClick={() => setIsCartOpen(true)}
                                className="relative p-2 text-grad-brown hover:bg-grad-pink hover:bg-opacity-20 rounded-full transition"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
                                {cart.length > 0 && (
                                    <span className="absolute top-0 right-0 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">
                                        {cart.length}
                                    </span>
                                )}
                            </button>
                        </div>
                    </header>

                    {/* Hero Section */}
                    <section className="bg-grad-pink bg-opacity-30 py-16 text-center px-4">
                        <div className="max-w-3xl mx-auto">
                            <h2 className="text-4xl md:text-5xl font-serif text-grad-brown mb-4">Recuerdos que duran para siempre</h2>
                            <p className="text-lg text-gray-700 mb-8">Personaliza tus productos de graduación de manera fácil, rápida y en un solo lugar.</p>
                            <a href="#catalogo" className="bg-grad-brown text-white px-8 py-3 rounded-full font-semibold shadow-lg hover:bg-opacity-90 transition">
                                Ver Catálogo
                            </a>
                        </div>
                    </section>

                    {/* Catálogo */}
                    <main id="catalogo" className="flex-grow max-w-6xl mx-auto px-4 py-16">
                        <h3 className="text-2xl font-bold text-grad-brown mb-8 text-center">Nuestros Productos</h3>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            {products.map(product => (
                                <div key={product.id} className="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition flex flex-col">
                                    <div className="h-64 bg-gray-50 flex items-center justify-center p-4">
                                        <img src={product.img} alt={product.name} className="max-h-full max-w-full object-contain drop-shadow-md" />
                                    </div>
                                    <div className="p-6 flex flex-col flex-grow">
                                        <h4 className="text-xl font-bold text-gray-800 mb-2">{product.name}</h4>
                                        <p className="text-gray-600 text-sm mb-4 flex-grow">{product.description}</p>
                                        <div className="flex justify-between items-center mt-auto">
                                            <span className="text-lg font-bold text-grad-brown">C${product.price}</span>
                                            <button 
                                                onClick={() => openCustomization(product)}
                                                className="bg-grad-pink text-grad-brown font-semibold px-4 py-2 rounded-lg hover:bg-opacity-80 transition"
                                            >
                                                Personalizar
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="bg-grad-brown text-white py-8 text-center">
                        <p className="font-serif text-xl mb-2">GradBox</p>
                        <p className="text-sm opacity-80">Feria de Innovación y Competencias Empresariales</p>
                        <p className="text-xs opacity-60 mt-4">© 2026 Todos los derechos reservados.</p>
                    </footer>

                    {/* Modal de Personalización */}
                    {selectedProduct && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl relative">
                                <button 
                                    onClick={() => setSelectedProduct(null)}
                                    className="absolute top-4 right-4 text-gray-500 hover:text-gray-800"
                                >
                                    ✕
                                </button>
                                <h3 className="text-2xl font-bold text-grad-brown mb-2">Personaliza tu {selectedProduct.name}</h3>
                                <p className="text-gray-600 mb-4 text-sm">¿Cómo quieres que luzca tu producto?</p>
                                
                                <div className="mb-4">
                                    <label className="block text-sm font-semibold text-gray-700 mb-2">Texto, Nombre o Frase (Opcional)</label>
                                    <textarea 
                                        value={customText}
                                        onChange={(e) => setCustomText(e.target.value)}
                                        placeholder="Ej: Generación 2026, ¡Lo logramos!"
                                        className="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-grad-pink resize-none h-24"
                                    ></textarea>
                                </div>
                                
                                <div className="bg-grad-beige p-3 rounded-lg text-sm text-gray-700 mb-6">
                                    <p><strong>Nota:</strong> Si deseas agregar una fotografía o diseño específico, podrás enviarla directamente a nuestro WhatsApp después de hacer el pedido.</p>
                                </div>

                                <button 
                                    onClick={addToCart}
                                    className="w-full bg-grad-brown text-white font-bold py-3 rounded-lg hover:bg-opacity-90 transition"
                                >
                                    Agregar al Carrito - C${selectedProduct.price}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Sidebar del Carrito */}
                    {isCartOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex justify-end z-50">
                            <div className="bg-white w-full max-w-md h-full flex flex-col shadow-2xl animate-slide-in">
                                <div className="p-4 border-b flex justify-between items-center bg-grad-nude">
                                    <h3 className="text-xl font-bold text-grad-brown">Tu Pedido</h3>
                                    <button onClick={() => setIsCartOpen(false)} className="text-gray-600 hover:text-black">✕</button>
                                </div>
                                
                                <div className="flex-grow overflow-y-auto p-4">
                                    {cart.length === 0 ? (
                                        <div className="text-center text-gray-500 mt-10">
                                            <p>Tu carrito está vacío.</p>
                                        </div>
                                    ) : (
                                        cart.map(item => (
                                            <div key={item.cartId} className="flex gap-4 border-b py-4">
                                                <img src={item.img} alt={item.name} className="w-16 h-16 object-contain bg-gray-50 rounded" />
                                                <div className="flex-grow">
                                                    <h4 className="font-bold text-gray-800">{item.name}</h4>
                                                    <p className="text-sm text-gray-600">C${item.price}</p>
                                                    {item.customText && (
                                                        <p className="text-xs text-gray-500 mt-1 italic border-l-2 border-grad-pink pl-2">"{item.customText}"</p>
                                                    )}
                                                </div>
                                                <button 
                                                    onClick={() => removeFromCart(item.cartId)}
                                                    className="text-red-400 hover:text-red-600 text-sm h-fit"
                                                >
                                                    Eliminar
                                                </button>
                                            </div>
                                        ))
                                    )}
                                </div>
                                
                                <div className="p-6 border-t bg-gray-50">
                                    <div className="flex justify-between font-bold text-lg mb-4">
                                        <span>Total estimado:</span>
                                        <span className="text-grad-brown">C${cartTotal}</span>
                                    </div>
                                    <button 
                                        onClick={handleCheckout}
                                        disabled={cart.length === 0}
                                        className={`w-full py-3 rounded-lg font-bold transition flex items-center justify-center gap-2 ${cart.length === 0 ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-green-500 text-white hover:bg-green-600 shadow-lg'}`}
                                    >
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                                        Enviar pedido por WhatsApp
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
